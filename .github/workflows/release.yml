name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish application
        run: >
          dotnet publish SentientDesk/SentientDesk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "SentientDesk-Portable-$version.zip"
          $bundle = Join-Path $env:RUNNER_TEMP "SentientDesk"
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -Path "publish\*" -Destination $bundle -Recurse -Force
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path $bundle -DestinationPath $zipName -CompressionLevel Optimal
          Remove-Item $bundle -Recurse -Force
          if (-not (Test-Path $zipName)) { throw "Portable zip was not created: $zipName" }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download previous release assets
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir Releases

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId SentientDesk
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe SentientDesk.exe
          --packTitle SentientDesk
          --packAuthors SentientDesk
          --msi
          --instLocation Either
          --instConclusion installer/conclusion.md
          --outputDir Releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir Releases
          --publish
          --releaseName "SentientDesk ${{ steps.version.outputs.version }}"
          --tag ${{ steps.version.outputs.tag }}

      - name: Attach portable zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ steps.version.outputs.tag }}
          SentientDesk-Portable-${{ steps.version.outputs.version }}.zip
          --clobber
